# =============================================================================
#  Aether Desktop (Windows) - fully automated build / package / release
# -----------------------------------------------------------------------------
#  ساختار ماژولار v18:
#    * validate  (Ubuntu) : هزینه‌ی تقریباً صفر؛ پیش از روشن‌شدن runner های
#                           ویندوزی ساختار مخزن را می‌سنجد: فایل‌های لازم،
#                           JSON معتبر، پارس‌شدن هر فایل JS، سازگاری داخلی
#                           هستهٔ vendored و مانیفست/نصاب.
#    * sync-core (Ubuntu) : فقط با درخواست دستی (پین CORE_TARGET یا force).
#                           در push/PR عادی هیچ کاری نمی‌کند تا بیلد کاملاً
#                           تکرارپذیر باشد و کلون+آپلود بالادست (چند دقیقه و
#                           ~10MB artifact) هر بار پرداخت نشود.
#    * build     (Windows): x64/x86 موازی. کش rust این بار BOTH کارسپیس‌ها را
#                           می‌پوشاند (src-tauri + کریت هسته که کامپایلش
#                           سنگین است). clippy و audit فقط روی x64 اجرا می‌شود
#                           تا هزینه نصف شود. npm سی با lockfile کامیت‌شده.
#    * release   (Ubuntu) : انتشار idempotent با CLI رسمی gh (بدون اکشن شخص
#                           ثالث) + جابه‌جایی تگ روی همین کامیت.
#
#  خروجی هر اجرا:
#    Aether-Setup-<ver>-x64.exe / -x86.exe     (Inno Setup + Uninstaller)
#    Aether-Portable-<ver>-x64.zip / -x86.zip
#    SHA256SUMS.txt
#
#  تجربه‌های ثبت‌شده از خطاهای قدیمی (خلاصه):
#    - کش npm به lockfile دستی وابسته بود که وجود نداشت؛ حالا package-lock.json
#      در مخزن است و از `npm ci` با کش تعریف‌شده استفاده می‌شود.
#    - rust-cache پیش از وجود src/main.rs اجرا شده بود؛ مرحلهٔ validate الآن
#      وجود همهٔ فایل‌های لازم را پیش از هر کاری تضمین می‌کند.
#    - انتشار با softprops/action-gh-release روی Node منسوخ شکست خورد؛
#      جایگزین: gh رسمی، idempotent با retry.
# =============================================================================
name: Build Windows

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      core_target:
        description: >-
          Pin the engine core to an exact upstream version (e.g. 1.8.0) and
          re-apply our patches on top of it. Empty = keep the vendored core
          exactly as committed (deterministic).
        required: false
        default: ''
      core_sync:
        description: >-
          Set to 'force' to re-pull the latest upstream release even without a
          pin (CORE_TARGET wins over a manual latest). 'off' keeps the vendored
          core untouched.
        required: false
        default: ''    # حواستان باشد: '' یعنی «همان حلقهٔ کامیت‌شده»، نه «آخرین بالادست».

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  AETHER_REPO: CluvexStudio/Aether

jobs:
  # ---------------------------------------------------------------------------
  # 0) VALIDATE — ساختار مخزن + گیت JS + یکدستی هستهٔ vendored.
  # ---------------------------------------------------------------------------
  validate:
    name: Validate (sanity + core consistency)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Every file the pipeline needs must exist
        shell: bash
        run: |
          missing=0
          required=(
            "package.json"
            "package-lock.json"
            "vite.config.js"
            "CORE_VERSION"
            "native/aether/CORE_VERSION"
            "native/aether/aether/Cargo.toml"
            "native/aether/aether/Cargo.lock"
            "native/aether/.upstream-baseline/aether/src/prober.rs"
            "native/aether/.upstream-baseline/aether/src/wg_prober.rs"
            "src/index.html"
            "src/main.js"
            "src/styles/tokens.css"
            "src/styles/app.css"
            "src/styles/desktop.css"
            "src/views/home.js"
            "src/views/advanced.js"
            "src/views/diagnostics.js"
            "src/views/share.js"
            "src/views/about.js"
            "installer/Persian.isl"
            "installer/LICENSE.rtf"
            "installer/wizard-large.bmp"
            "installer/wizard-small.bmp"
            "installer/aether.iss"
            "src-tauri/Cargo.toml"
            "src-tauri/build.rs"
            "src-tauri/tauri.conf.json"
            "src-tauri/windows-manifest.xml"
            "src-tauri/capabilities/default.json"
            "src-tauri/icons/icon.ico"
            "src-tauri/src/main.rs"
            "src-tauri/src/profile.rs"
            "src-tauri/src/engine.rs"
            "src-tauri/src/state.rs"
            "src-tauri/src/store.rs"
            "src-tauri/src/tun.rs"
            "src-tauri/src/probe.rs"
            "src-tauri/src/smart_auto.rs"
            "src-tauri/src/share.rs"
            "src-tauri/src/diagnostics.rs"
            "src-tauri/src/log.rs"
            "scripts/sync-core.sh"
            "scripts/build-engine.ps1"
            "scripts/core-rollback.ps1"
            "scripts/fetch-wintun.ps1"
            "scripts/stage-payload.ps1"
            "scripts/make-portable.ps1"
            "scripts/embed-manifest.ps1"
            "scripts/smoke-test.ps1"
            "scripts/sign.ps1"
            "scripts/make-persian-isl.ps1"
            ".github/release-notes.md"
            "README.md"
            "README.fa.md"
            "SECURITY-AUDIT.md"
            "LICENSE"
          )
          for f in "${required[@]}"; do
            if [[ ! -f "$f" ]]; then
              echo "::error file=$f::فایل لازم در مخزن وجود ندارد: $f"
              missing=1
            fi
          done
          # هر `mod X;` در main.rs باید یک فایل واقعی داشته باشد.
          while read -r m; do
            if [[ ! -f "src-tauri/src/$m.rs" ]]; then
              echo "::error::main.rs ماژول '$m' را صدا می‌زند ولی src-tauri/src/$m.rs وجود ندارد."
              missing=1
            fi
          done < <(sed -n 's/^mod \([a-z_]*\);/\1/p' src-tauri/src/main.rs)
          [[ $missing -eq 0 ]] || exit 1
          echo "✓ ساختار مخزن کامل است."

      - name: JSON files must be valid
        run: |
          for f in src-tauri/tauri.conf.json src-tauri/capabilities/default.json package.json package-lock.json; do
            python3 -c "import json,sys; json.load(open('$f'))" || { echo "::error file=$f::JSON معتبر نیست"; exit 1; }
          done
          echo "✓ همهٔ فایل‌های JSON معتبرند."

      # گیت syntax جاوااسکریپت؛ خطای پراپر این‌جا در چند ثانیه دیده می‌شود
      # نه ده دقیقه بعد روی runner ویندوزی.
      - name: Every JS file must parse
        shell: bash
        run: |
          bad=0
          while IFS= read -r f; do
            node --check "$f" || { echo "::error file=$f::Syntax error in $f"; bad=1; }
          done < <(find src -name '*.js' | sort)
          [[ $bad -eq 0 ]] || exit 1
          echo "✓ همهٔ فایل‌های JS پارس می‌شوند."

      - name: Vendored core must be self-consistent
        shell: bash
        run: |
          set -euo pipefail
          bad=0
          BASELINE=$(sed -n 's/^BASELINE="\([^"]*\)"/\1/p' scripts/sync-core.sh | head -n1)
          [[ -n "$BASELINE" ]] || { echo "::error::sync-core.sh BASELINE خوانده نشد."; bad=1; }
          ROOTVER=$(cat CORE_VERSION 2>/dev/null || true)
          VENDORED=$(cat native/aether/CORE_VERSION 2>/dev/null || true)
          CARGOVER=$(sed -n 's/^version *= *"\([^"]*\)"/\1/p' native/aether/aether/Cargo.toml | head -n1)
          [[ "$ROOTVER" == "$BASELINE" && "$VENDORED" == "$BASELINE" && "$CARGOVER" == "$BASELINE" ]] || {
            echo "::error::عدم تطابق نسخه: sync-core.sh=$BASELINE, CORE_VERSION ریشه=$ROOTVER, vendored=$VENDORED, Cargo.toml=$CARGOVER"
            bad=1
          }
          # پروبرهای پچ‌شده: اگر از snapshot پایه منحرف شده‌اند، یا یک پچ
          # واقعی وارد شده (مجاز — sync-core هنگام همگام‌سازی ۳-طرفه merge
          # می‌کند و خودش baseline را هم تازه می‌کند) یا تغییر دستی است.
          # پس این‌جا فقط هشدار می‌دهیم، بیلد را نمی‌شکنیم.
          for rel in aether/src/prober.rs aether/src/wg_prober.rs; do
            if ! cmp -s "native/aether/$rel" "native/aether/.upstream-baseline/$rel"; then
              echo "::warning::$rel با .upstream-baseline یکسان نیست (پچ؟). sync-core.sh PATCHED_FILES را بررسی کنید."
            fi
          done
          # بیلد --locked به Cargo.lock نیاز دارد؛ هیچ پوشهٔ target نباید کامیت شود.
          test -f native/aether/aether/Cargo.lock || { echo "::error::native/aether/aether/Cargo.lock وجود ندارد."; bad=1; }
          if find native -type d -name target -print -quit | grep -q .; then
            echo "::error::پوشه‌های Cargo target در native کامیت شده‌اند."
            bad=1
          fi
          [[ $bad -eq 0 ]] || exit 1
          echo "✓ هستهٔ vendored ($VENDORED) یکدست است."

      - name: Windows manifest and installer launch checks
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          m = Path("src-tauri/windows-manifest.xml").read_text()
          i = Path("installer/aether.iss").read_text()
          assert 'level="requireAdministrator"' in m, "UAC manifest is not requireAdministrator"
          assert 'Microsoft.Windows.Common-Controls' in m, "TaskDialogIndirect dependency is missing"
          assert 'shellexec' in i.lower(), "installer must use ShellExecute for elevated EXE"
          st = Path("src-tauri/src/state.rs").read_text()
          pr = Path("src-tauri/src/probe.rs").read_text()
          assert 'WATCHDOG_INTERVAL_SECS: u64 = 30' in st
          assert 'WATCHDOG_FAILURE_THRESHOLD: u8 = 3' in st
          assert 'pub fn watchdog_probe' in pr
          print("✓ UAC, runtime manifest, watchdog and installer checks passed.")
          PY

      - name: Proxy Mode must not exist in the Windows edition
        shell: bash
        run: |
          if grep -rniE 'proxy[_-]?mode' src src-tauri/src installer 2>/dev/null | grep -vE 'profile\.rs|\.md$'; then
            echo "::error::Proxy Mode عمداً جزئی از نسخهٔ ویندوز نیست."
            exit 1
          fi
          echo "✓ هیچ مسیر کدی برای Proxy Mode وجود ندارد."

  # ---------------------------------------------------------------------------
  # 1) SYNC-CORE — فقط برای همگام‌سازی دستی هسته (پین نسخه یا force).
  #    در push/PR عادی هیچ فعلیتی ندارد؛ خروجی core_changed=false است و بیلدها
  #    از همان درخت کامیت‌شده استفاده می‌کنند.
  # ---------------------------------------------------------------------------
  sync-core:
    name: Sync core (manual pin only)
    needs: validate
    runs-on: ubuntu-latest
    outputs:
      core_changed: ${{ steps.flag.outputs.core_changed }}
    steps:
      - uses: actions/checkout@v4

      - name: Committed core version
        id: commit
        run: echo "committed=$(cat native/aether/CORE_VERSION)" >> "$GITHUB_OUTPUT"

      - name: Sync core (never fails the build)
        id: sync
        if: ${{ github.event_name == 'workflow_dispatch' && (github.event.inputs.core_target != '' || github.event.inputs.core_sync == 'force') }}
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CORE_TARGET: ${{ github.event.inputs.core_target }}
          CORE_SYNC: ${{ github.event.inputs.core_sync }}
        run: bash scripts/sync-core.sh

      - name: Decide if the synced core differs from the committed tree
        id: flag
        if: ${{ github.event_name == 'workflow_dispatch' && (github.event.inputs.core_target != '' || github.event.inputs.core_sync == 'force') }}
        shell: bash
        env:
          SYNCED: ${{ steps.sync.outputs.core_version }}
        run: |
          COMMITTED=$(cat native/aether/CORE_VERSION)
          if [[ -n "$SYNCED" && "$SYNCED" != "$COMMITTED" ]]; then
            echo "core_changed=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Core synced to $SYNCED (was $COMMITTED) - uploading for the build jobs."
          else
            echo "core_changed=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Core unchanged - build jobs will use the committed tree."
          fi

      - name: Upload synced core (only when the tree actually changed)
        if: ${{ github.event_name == 'workflow_dispatch' && (github.event.inputs.core_target != '' || github.event.inputs.core_sync == 'force') && steps.flag.outputs.core_changed == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: core-src
          path: native/aether
          retention-days: 1
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # 2) BUILD — موتور + اپ + بسته‌بندی؛ x64 و x86 به‌صورت موازی روی دو runner.
  # ---------------------------------------------------------------------------
  build:
    name: Build ${{ matrix.arch }}
    needs: [validate, sync-core]
    runs-on: windows-latest
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            rust_target: x86_64-pc-windows-msvc
            wintun_dir: bin/amd64
            inno_arch: x64compatible
          - arch: x86
            rust_target: i686-pc-windows-msvc
            wintun_dir: bin/x86
            inno_arch: ''

    steps:
      - uses: actions/checkout@v4

      # فقط وقتی همگام‌سازی دستی هسته را عوض کرد؛ در حالت عادی جای خالی است.
      - name: Download pinned core (manual sync only)
        if: needs.sync-core.outputs.core_changed == 'true'
        uses: actions/download-artifact@v4
        with:
          name: core-src
          path: native/aether

      - name: Resolve version
        id: ver
        shell: pwsh
        run: |
          $v = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          if ($env:GITHUB_REF -like 'refs/tags/v*') {
            $v = $env:GITHUB_REF -replace '^refs/tags/v',''
          }
          "version=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "Building Aether $v (${{ matrix.arch }})"

      # ---- Toolchain -------------------------------------------------------
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install frontend deps (locked)
        run: npm ci --no-audit --no-fund

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}
          components: clippy, rustfmt

      # lockfile src-tauri در مخزن کامیت نیست؛ برای داشتن کلید کش پایدار و
      # audit معنادار همین‌جا و بدون کامپایل ساخته می‌شود.
      - name: Generate src-tauri Cargo.lock (cache + audit foundation)
        working-directory: src-tauri
        run: cargo generate-lockfile

      # کش هر دو کارسپیس: src-tauri و کریت هسته (بیشترین زمان کامپایل).
      # ذخیرهٔ کش فقط روی main/tags تا PRها را سنگین نکند.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri
            native/aether/aether
          key: ${{ matrix.arch }}
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/') }}

      - name: Build frontend bundle
        run: npm run web:build

      # مرتب‌سازی خودکار کد — هرگز بیلد را نمی‌شکند.
      - name: Auto-format Rust sources
        continue-on-error: true
        working-directory: src-tauri
        run: cargo fmt --all

      # ---- بیلد هستهٔ aether ------------------------------------------
      - name: Build engine (aether.exe)
        timeout-minutes: 40
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          ./scripts/build-engine.ps1 -Target '${{ matrix.rust_target }}'
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::warning::Engine build failed with the freshly synced core - rolling back."
            ./scripts/core-rollback.ps1
            $ErrorActionPreference = 'Stop'
            ./scripts/build-engine.ps1 -Target '${{ matrix.rust_target }}'
          }

      - name: Fetch Wintun driver
        shell: pwsh
        run: ./scripts/fetch-wintun.ps1 -ArchDir '${{ matrix.wintun_dir }}'

      # تست‌ها عمداً بعد از ساخت موتور اجرا می‌شوند؛ tauri.conf.json فایل‌های
      # dist-engine را به‌عنوان resource لازم دارد. Fail fast.
      - name: Unit tests (engine contract parity with Android)
        working-directory: src-tauri
        run: cargo test --target ${{ matrix.rust_target }}

      # کیفیّت کد — x64 کافی است (هر دو معماری همان کد را می‌سازند)؛
      # هرگز بیلد را نمی‌شکند و اخطارها به‌صورت annotation دیده می‌شوند.
      - name: Clippy (lint, non-blocking)
        if: always() && !cancelled() && matrix.arch == 'x64'
        continue-on-error: true
        working-directory: src-tauri
        run: cargo clippy --all-targets --target ${{ matrix.rust_target }} -- -D warnings

      # آسیب‌پذیری وابستگی‌ها — non-blocking تا advisory تازه بیلد را از انتشار
      # نیندازد ولی در Actions قابل دیدن بماند.
      - name: Cargo audit (non-blocking)
        if: always() && !cancelled() && matrix.arch == 'x64'
        continue-on-error: true
        shell: pwsh
        working-directory: src-tauri
        run: |
          if (Get-Command cargo-audit -ErrorAction SilentlyContinue) {
            cargo audit --deny warnings
          } else {
            cargo install cargo-audit --locked
            cargo audit --deny warnings
          }

      # ---- بیلد اپ -------------------------------------------------------
      # --no-bundle: بسته‌بندی (NSIS/Inno) توسط مراحل بعدی انجام می‌شود.
      - name: Build Aether (Tauri, release)
        timeout-minutes: 40
        shell: pwsh
        run: |
          npm run tauri -- build `
            --target ${{ matrix.rust_target }} `
            --no-bundle `
            --config '{"version":"${{ steps.ver.outputs.version }}"}'

      # Tauri صاحب VERSION resource است؛ فقط مانیفست را بعد از لینک امبد
      # می‌کنیم (گرنه winres + Tauri به CVT1100 برمی‌خورد).
      - name: Embed and verify requireAdministrator manifest
        shell: pwsh
        run: |
          $exe = "src-tauri/target/${{ matrix.rust_target }}/release/aether-desktop.exe"
          if (-not (Test-Path $exe)) { throw "Release executable not found: $exe" }
          ./scripts/embed-manifest.ps1 -ExePath $exe

      - name: Stage payload
        shell: pwsh
        run: ./scripts/stage-payload.ps1 -Target '${{ matrix.rust_target }}' -Arch '${{ matrix.arch }}'

      - name: Build portable ZIP
        shell: pwsh
        run: ./scripts/make-portable.ps1 -Arch '${{ matrix.arch }}' -Version '${{ steps.ver.outputs.version }}'

      # ---- ویزارد نصب حرفه‌ای (Inno Setup 6) --------------------------
      - name: Ensure Inno Setup 6
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup --no-progress -y }
          if (-not (Test-Path $iscc)) { throw "Inno Setup 6 could not be installed" }
          "ISCC=$iscc" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      # فایل زبان فارسی از روی Default.isl رسمی خود Inno ساخته می‌شود.
      - name: Generate the Persian wizard language file
        shell: pwsh
        run: ./scripts/make-persian-isl.ps1 -InnoDir (Split-Path "$env:ISCC")

      - name: Build professional installer
        shell: pwsh
        run: |
          & "$env:ISCC" `
            "/DMyAppVersion=${{ steps.ver.outputs.version }}" `
            "/DMyArch=${{ matrix.arch }}" `
            "/DArchAllowed=${{ matrix.inno_arch }}" `
            "/DPayloadDir=$(Resolve-Path dist/payload-${{ matrix.arch }})" `
            "/DOutputDir=$(Resolve-Path dist)" `
            installer/aether.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed" }

      # ---- امضای کد (اختیاری) --------------------------------------
      - name: Code-sign artifacts
        if: env.SIGN_PFX != ''
        shell: pwsh
        env:
          SIGN_PFX: ${{ secrets.WINDOWS_PFX_BASE64 }}
          SIGN_PFX_PASSWORD: ${{ secrets.WINDOWS_PFX_PASSWORD }}
        run: ./scripts/sign.ps1 -Arch '${{ matrix.arch }}'

      # نصب/حذف واقعی با سقف زمانی سخت — هیچ‌وقت بی‌نهایت گیر نکند.
      - name: Smoke test the installer (silent install + uninstall)
        timeout-minutes: 10
        shell: pwsh
        run: ./scripts/smoke-test.ps1 -Arch '${{ matrix.arch }}' -Version '${{ steps.ver.outputs.version }}'

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: aether-${{ matrix.arch }}
          path: |
            dist/Aether-Setup-*.exe
            dist/Aether-Portable-*.zip
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # 3) RELEASE — انتشار idempotent با gh رسمی؛ تگ روی همین کامیت جابه‌جا می‌شود
  #    تا Source code (zip/tar.gz) تازه بماند. (بیرون از PR)
  # ---------------------------------------------------------------------------
  release:
    name: Publish GitHub Release
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: aether-*
          merge-multiple: true
          path: dist

      - name: Resolve version + channel
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            V="${GITHUB_REF#refs/tags/v}"
            TAG="${GITHUB_REF#refs/tags/}"
          else
            V=$(python3 -c "import json;print(json.load(open('src-tauri/tauri.conf.json'))['version'])")
            TAG="v$V"
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG"    >> "$GITHUB_OUTPUT"

      - name: Every expected artifact must exist before publishing
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          for pat in "dist/Aether-Setup-*-x64.exe" "dist/Aether-Setup-*-x86.exe" \
                     "dist/Aether-Portable-*-x64.zip" "dist/Aether-Portable-*-x86.zip"; do
            if ! compgen -G "$pat" > /dev/null; then
              echo "::error::خروجی بیلد پیدا نشد: $pat"
              missing=1
            fi
          done
          [[ $missing -eq 0 ]]
          ls -la dist

      - name: Checksums
        working-directory: dist
        run: sha256sum Aether-* | tee SHA256SUMS.txt

      # برای بیلدهای main تگ روی همین کامیتِ ساخته‌شده جابه‌جا می‌شود تا
      # آرشیوهای منبع تازه بمانند (برای push تگ دستی رد می‌شود).
      - name: Point the release tag at this exact build commit
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f "${{ steps.meta.outputs.tag }}" "$GITHUB_SHA"
          git push origin "refs/tags/${{ steps.meta.outputs.tag }}" --force

      - name: Publish (gh CLI — no third-party action)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.meta.outputs.tag }}
          TITLE: Aether v${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          assets=(dist/Aether-Setup-*.exe dist/Aether-Portable-*.zip dist/SHA256SUMS.txt)

          # بیلدهای main: ریلیز کهنه حذف می‌شود تا تاریخ امروز را بگیرد.
          if [[ "$GITHUB_REF" != refs/tags/* ]]; then
            gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" -y || true
          fi

          # idempotent + retry: بساز، یا اگر بود همان را تازه کن + --clobber.
          for attempt in 1 2 3; do
            if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
              gh release upload "$TAG" "${assets[@]}" --repo "$GITHUB_REPOSITORY" --clobber
              gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" \
                --title "$TITLE" --notes-file .github/release-notes.md \
                --target "$GITHUB_SHA" --latest --draft=false --prerelease=false
              echo "✓ release refreshed ($TAG)"
              exit 0
            fi
            if gh release create "$TAG" "${assets[@]}" --repo "$GITHUB_REPOSITORY" \
                 --title "$TITLE" --notes-file .github/release-notes.md \
                 --target "$GITHUB_SHA" --latest; then
              echo "✓ release created ($TAG)"
              exit 0
            fi
            echo "::warning::تلاش $attempt برای انتشار ناموفق بود؛ ۵ ثانیه صبر و تلاش دوباره…"
            sleep 5
          done
          echo "::error::انتشار ریلیز پس از ۳ تلاش ناموفق ماند."
          exit 1